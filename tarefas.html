<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarefas da equipe · Central de Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<style>
/* Layout: cabeçalho + barra de filtros/visões; área alterna kanban por fase, lista agrupada e calendário de entregas; card da tarefa abre em painel lateral */
:root{
  --f-ideia:#8592A6; --f-plan:#6B3FA0; --f-fazer:#2F7FD0; --f-and:#D99A12; --f-agu:#C2571C; --f-ok:#1E9E6A;
  --p-urg:#C23A1C; --p-urg-bg:#FCE4DC; --p-imp:#9A5B00; --p-imp-bg:#FFF0CC; --p-nor:#2F6FB0; --p-nor-bg:#DFEDF8; --p-bai:#5C6B82; --p-bai-bg:#E9EDF4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --f-ideia:#8F9CB2; --f-plan:#C4A6F2; --f-fazer:#6DB0F2; --f-and:#F2C46A; --f-agu:#F29A6A; --f-ok:#5FD39A;
  --p-urg:#FF8A6E; --p-urg-bg:#47201A; --p-imp:#F2C46A; --p-imp-bg:#3A2D12; --p-nor:#8CC4F0; --p-nor-bg:#16324A; --p-bai:#9AA8BE; --p-bai-bg:#1C2942}}
:root[data-theme="dark"]{
  --f-ideia:#8F9CB2; --f-plan:#C4A6F2; --f-fazer:#6DB0F2; --f-and:#F2C46A; --f-agu:#F29A6A; --f-ok:#5FD39A;
  --p-urg:#FF8A6E; --p-urg-bg:#47201A; --p-imp:#F2C46A; --p-imp-bg:#3A2D12; --p-nor:#8CC4F0; --p-nor-bg:#16324A; --p-bai:#9AA8BE; --p-bai-bg:#1C2942}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px}
.filters input{min-width:200px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.st{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.st b{font-family:var(--mono);font-weight:500}
.st.late{border-color:var(--bad);color:var(--bad)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
/* tags */
.pri{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--pc);background:var(--pb);white-space:nowrap}
.pri::before{content:"⚑";font-size:10px}
.fase{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.avs{display:inline-flex}
.av{width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--bg);display:inline-grid;place-items:center;font-weight:800;font-size:10px;border:2px solid var(--surface);margin-left:-6px;flex:none}
.avs .av:first-child{margin-left:0}
.due{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.due.late{color:var(--bad);font-weight:600}
.cmt{font-size:12px;color:var(--muted);white-space:nowrap}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.colk{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:360px;min-width:0}
.colk.drop{outline:2px dashed var(--accent);outline-offset:-3px}
.colk header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px;border-bottom:3px solid var(--c)}
.colk header b{font-size:14px}
.colk header span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.addk{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:600}
.addk:hover{color:var(--fg);border-color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card.done .t{text-decoration:line-through;color:var(--muted)}
/* lista */
.lgroup{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lgroup>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-left:4px solid var(--c);background:var(--surface)}
.lgroup>header b{font-size:14.5px}
.lgroup>header span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lgroup>header button{margin-left:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:7px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
td.tt{font-weight:600;max-width:340px}
.lempty{padding:12px 14px;color:var(--muted);font-size:13px}
/* calendário */
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar b{font-size:18px;min-width:160px;text-align:center;text-transform:capitalize}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.grid .day:nth-child(7n){border-right:0}
.day.out{background:var(--bg)}
.day.drop{outline:2px dashed var(--accent);outline-offset:-3px}
.day .num{font-family:var(--mono);font-size:12.5px}
.day.today .num{background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:0 5px;align-self:flex-start}
.chip{display:flex;flex-direction:column;gap:2px;border:0;border-left:3px solid var(--c);background:var(--bg);border-radius:5px;padding:4px 6px;font-size:12px;text-align:left;cursor:pointer;width:100%;min-width:0;color:var(--fg)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chip.done span{text-decoration:line-through;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.empty strong{color:var(--fg);display:block;font-size:16px;margin-bottom:4px}
/* painel do card */
.overlay{position:fixed;inset:0;background:rgba(10,16,28,.45);display:flex;justify-content:flex-end;z-index:20}
.panel{background:var(--surface);width:min(640px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column}
.ph{position:sticky;top:0;background:var(--surface);z-index:2;padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ph .r1{display:flex;gap:10px;align-items:flex-start}
.ph input.title{flex:1;border:0;background:transparent;font-size:21px;font-weight:800;color:var(--navy);padding:2px 0;min-width:0}
.ph input.title:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.x{border:0;background:var(--surface-2);border-radius:7px;width:32px;height:32px;font-size:18px;cursor:pointer;flex:none}
.pb{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.props{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px 14px;align-items:center}
.props>label,.props>.lab{font-size:12.5px;font-weight:700;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:12.5px;font-weight:700;color:var(--muted)}
.panel input[type=text],.panel input[type=date],.panel select,.panel textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.panel textarea{min-height:80px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:13px;font-weight:700;background:var(--surface);cursor:pointer}
.opt input:checked+span{border-color:var(--pc,var(--accent));background:var(--pb,var(--accent-soft));color:var(--pc,var(--accent))}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.opt .av{margin:0;width:20px;height:20px;font-size:9px;border:0}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:14.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h3 small{font-weight:500;color:var(--muted);font-size:12px}
.tr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.comments{display:flex;flex-direction:column;gap:10px}
.cm{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px}
.cm .av{margin:0;width:28px;height:28px;font-size:10.5px;border:0}
.cm .bx{background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.cm .bx b{font-size:13px}
.cm .bx time{font-size:11.5px;color:var(--muted);margin-left:6px}
.cm .bx p{margin:4px 0 0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.hist li{list-style:none}
.hist b{color:var(--fg)}
.hist ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pf{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.notice{background:var(--surface-2);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
@media (max-width:760px){
  .props{grid-template-columns:1fr}
  .tr3{grid-template-columns:1fr}
  .dow{display:none}.grid{grid-template-columns:1fr}.day{min-height:0;border-right:0}.day.out,.day.blank:not(.today){display:none}
  .kanban{grid-template-columns:repeat(6,minmax(240px,82vw))}
  .filters input{min-width:0;flex:1}
}
</style>
</head>
<body>
<header id="app-nav"></header>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Demandas do setor de Marketing</div><h1>Tarefas <span>da equipe</span></h1></div>
    <button class="btn primary" type="button" id="newBtn">+ Nova tarefa</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <div class="filters">
      <input type="search" id="q" placeholder="Buscar tarefa" aria-label="Buscar tarefa">
      <select id="fResp" aria-label="Responsável"></select>
      <select id="fPri" aria-label="Prioridade"></select>
    </div>
    <div class="seg" id="viewSeg" role="group" aria-label="Visualização">
      <button type="button" data-v="kanban" aria-pressed="true">Kanban</button>
      <button type="button" data-v="lista" aria-pressed="false">Lista</button>
      <button type="button" data-v="cal" aria-pressed="false">Calendário</button>
    </div>
  </div>

  <section id="vKanban"><div class="kanban" id="kanban"></div></section>
  <section id="vLista" hidden style="display:flex;flex-direction:column;gap:12px"></section>
  <section id="vCal" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="monthbar"><button class="icon" type="button" id="prevM" aria-label="Mês anterior">‹</button><b id="mTitle"></b><button class="icon" type="button" id="nextM" aria-label="Próximo mês">›</button><span class="hint">Tarefas pela data de entrega · arraste para mudar a entrega</span></div>
    <div class="cal"><div class="dow" id="dow"></div><div class="grid" id="grid"></div></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="panel" id="form" novalidate>
    <div class="ph">
      <div class="r1"><input class="title" type="text" id="iTitulo" maxlength="140" placeholder="Nome da tarefa" aria-label="Nome da tarefa"><button class="x" type="button" id="closeBtn" aria-label="Fechar">×</button></div>
      <div class="hint" id="meta"></div>
    </div>
    <div class="pb">
      <div class="props">
        <label for="iFase">Fase da demanda</label><select id="iFase"></select>
        <span class="lab">Prioridade</span><div class="opts" id="oPri"></div>
        <label for="iIni">Data de início</label><input type="date" id="iIni">
        <label for="iEnt">Data de entrega</label><input type="date" id="iEnt">
        <span class="lab">Responsáveis</span><div class="opts" id="oResp"></div>
      </div>
      <div class="field"><label for="iDesc">Descrição</label><textarea id="iDesc" maxlength="2000" placeholder="O que precisa ser feito"></textarea></div>
      <div class="field"><label for="iBrief">Briefing</label><textarea id="iBrief" maxlength="6000" style="min-height:120px" placeholder="Objetivo, público, referências, peças, prazos, links..."></textarea></div>

      <div class="sec" id="secTransf">
        <h3>Transferir demanda <small>passa a tarefa de um colaborador para outro e muda a fase</small></h3>
        <div class="tr3">
          <div class="field"><label for="tDe">De</label><select id="tDe"></select></div>
          <div class="field"><label for="tPara">Para</label><select id="tPara"></select></div>
          <div class="field"><label for="tFase">Nova fase</label><select id="tFase"></select></div>
        </div>
        <div class="field"><label for="tNota">Observação da transferência</label><input type="text" id="tNota" maxlength="300" placeholder="Ex.: arte aprovada, seguir com a programação"></div>
        <div><button class="btn" type="button" id="tBtn">Transferir</button></div>
        <p class="hint" id="tHint"></p>
      </div>

      <div class="sec">
        <h3>Comentários <small id="cCount"></small></h3>
        <div class="comments" id="cList"></div>
        <div class="field"><label for="cTxt" class="lab">Novo comentário</label><textarea id="cTxt" maxlength="2000" style="min-height:60px" placeholder="Escreva um comentário para a equipe"></textarea></div>
        <div><button class="btn" type="button" id="cBtn">Comentar</button></div>
      </div>

      <div class="sec"><h3>Histórico</h3><div class="hist" id="hList"></div></div>
      <p class="err" id="formErr" hidden></p>
    </div>
    <div class="pf"><div id="delArea"></div><div style="display:flex;gap:8px"><button class="btn" type="button" id="cancelBtn">Fechar</button><button class="btn primary" type="submit" id="saveBtn">Salvar</button></div></div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="assets/js/config.js" charset="utf-8"></script>
<script src="assets/js/marca.js" charset="utf-8"></script>
<script src="assets/js/store.js" charset="utf-8"></script>
<script src="assets/js/auth.js" charset="utf-8"></script>
<script src="assets/js/layout.js" charset="utf-8"></script>
<script>
(function(){
  const FASES=[{k:"ideia",n:"Ideia",c:"--f-ideia"},{k:"planejado",n:"Planejado",c:"--f-plan"},{k:"a_fazer",n:"A fazer",c:"--f-fazer"},{k:"em_andamento",n:"Em andamento",c:"--f-and"},{k:"aguardando",n:"Aguardando alinhamento",c:"--f-agu"},{k:"realizado",n:"Realizado",c:"--f-ok"}];
  const PRI=[{k:"urgente",n:"Urgente",c:"--p-urg",b:"--p-urg-bg"},{k:"importante",n:"Importante",c:"--p-imp",b:"--p-imp-bg"},{k:"normal",n:"Normal",c:"--p-nor",b:"--p-nor-bg"},{k:"baixa",n:"Baixa prioridade",c:"--p-bai",b:"--p-bai-bg"}];
  const DOW=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const $=id=>document.getElementById(id); const by=(a,k)=>a.find(x=>x.k===k);
  const pad=n=>String(n).padStart(2,"0");
  const isoD=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
  const hoje=()=>{const n=new Date();return isoD(n.getFullYear(),n.getMonth(),n.getDate());};
  const fd=s=>s?`${s.slice(8)}/${s.slice(5,7)}`:"";
  const fdt=s=>{if(!s)return"";const d=new Date(s);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});};
  const ini=n=>String(n||"?").trim().split(/\s+/).filter(p=>/^\p{L}/u.test(p)).slice(0,2).map(p=>p[0]).join("").toUpperCase();
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="style")e.setAttribute("style",v);else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!=null&&v!==false)e.setAttribute(k,v===true?"":v);}kids.forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));});return e;}
  let tt;const toast=m=>{const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400);};

  let me=null, tasks=[], users=[], view="kanban", col=null, editingId=null, Y=new Date().getFullYear(), M=new Date().getMonth();
  const F={q:"",resp:"",pri:""};
  const userName=e=>{const u=users.find(x=>x.email===e);return u?(u.nome||u.email):(e||"");};
  const avatar=e=>el("span",{class:"av",title:userName(e)},ini(userName(e)));
  const faseOf=t=>by(FASES,t.fase)||FASES[0];
  const priOf=t=>by(PRI,t.prioridade)||by(PRI,"normal");
  const priTag=t=>{const p=priOf(t);return el("span",{class:"pri",style:`--pc:var(${p.c});--pb:var(${p.b})`},p.n);};
  const isLate=t=>t.entrega&&t.entrega<hoje()&&t.fase!=="realizado";
  const dueEl=t=>t.entrega?el("span",{class:"due"+(isLate(t)?" late":""),title:isLate(t)?"Entrega atrasada":"Data de entrega"},(isLate(t)?"⚠ ":"")+"Entrega "+fd(t.entrega)):null;
  const avs=t=>el("span",{class:"avs"},...(t.responsaveis||[]).map(avatar));
  const cmts=t=>(t.comentarios||[]).length?el("span",{class:"cmt"},`💬 ${(t.comentarios||[]).length}`):null;

  // preferência de visualização por usuário (no navegador e no cadastro do usuário)
  const prefKey=()=>"tarefas-visao:"+(me?me.email:"");
  function loadPref(){const p=me&&me.preferencias&&me.preferencias.tarefasVisao;let v=p;try{v=localStorage.getItem(prefKey())||p;}catch(_){}if(["kanban","lista","cal"].includes(v))view=v;}
  function savePref(){try{localStorage.setItem(prefKey(),view);}catch(_){}
    if(me)Store.collection("usuarios").doc(Auth.docId(me.email)).update({preferencias:Object.assign({},me.preferencias,{tarefasVisao:view})}).catch(()=>{});}

  function filtered(){const q=F.q.trim().toLowerCase();
    return tasks.filter(t=>(!F.resp||(F.resp==="__eu"?(t.responsaveis||[]).includes(me.email):F.resp==="__sem"?!(t.responsaveis||[]).length:(t.responsaveis||[]).includes(F.resp)))
      &&(!F.pri||priOf(t).k===F.pri)&&(!q||[t.titulo,t.descricao,t.briefing].join(" ").toLowerCase().includes(q)));}
  const sortT=a=>a.slice().sort((x,y)=>{const pr=k=>PRI.findIndex(p=>p.k===priOf(k).k);return (x.entrega||"9999").localeCompare(y.entrega||"9999")||pr(x)-pr(y);});

  function fillFilters(){const r=$("fResp"),cur=F.resp;r.textContent="";
    r.append(el("option",{value:""},"Todos os responsáveis"),el("option",{value:"__eu"},"Minhas tarefas"),el("option",{value:"__sem"},"Sem responsável"),...users.map(u=>el("option",{value:u.email},u.nome||u.email)));r.value=cur;
    const p=$("fPri");if(!p.options.length){p.append(el("option",{value:""},"Todas as prioridades"),...PRI.map(x=>el("option",{value:x.k},x.n)));}}
  $("q").addEventListener("input",e=>{F.q=e.target.value;render();});
  $("fResp").addEventListener("change",e=>{F.resp=e.target.value;render();});
  $("fPri").addEventListener("change",e=>{F.pri=e.target.value;render();});

  function renderStats(){const L=filtered(), s=$("stats");s.textContent="";
    s.append(el("span",{class:"st"},"Tarefas ",el("b",null,L.length)));
    FASES.forEach(f=>s.append(el("span",{class:"st"},el("i",{class:"dot",style:`--c:var(${f.c})`}),f.n,el("b",null,L.filter(t=>faseOf(t).k===f.k).length))));
    const late=L.filter(isLate).length; if(late)s.append(el("span",{class:"st late"},"⚠ Atrasadas ",el("b",null,late)));
    const mine=tasks.filter(t=>(t.responsaveis||[]).includes(me.email)&&t.fase!=="realizado").length;
    s.append(el("span",{class:"st"},"Minhas em aberto ",el("b",null,mine)));}

  function drop(node,fn){node.addEventListener("dragover",e=>{e.preventDefault();node.classList.add("drop");});node.addEventListener("dragleave",()=>node.classList.remove("drop"));
    node.addEventListener("drop",e=>{e.preventDefault();node.classList.remove("drop");const id=e.dataTransfer.getData("text/plain");if(id)fn(id);});}
  function card(t){const f=faseOf(t);
    return el("div",{class:"card"+(f.k==="realizado"?" done":""),draggable:"true",tabindex:"0",role:"button","aria-label":t.titulo||"Tarefa",
      onclick:()=>openTask(t),onkeydown:e=>{if(e.key==="Enter")openTask(t);},ondragstart:e=>e.dataTransfer.setData("text/plain",t.id)},
      el("div",{class:"m"},priTag(t),cmts(t)),el("div",{class:"t"},t.titulo||"Sem nome"),el("div",{class:"m"},dueEl(t)||el("span",{class:"due"},"Sem entrega"),avs(t)));}
  function renderKanban(){const k=$("kanban");k.textContent="";const L=sortT(filtered());
    FASES.forEach(f=>{const items=L.filter(t=>faseOf(t).k===f.k);
      const c=el("div",{class:"colk",style:`--c:var(${f.c})`},el("header",null,el("b",null,f.n),el("span",null,items.length)));
      items.forEach(t=>c.append(card(t)));
      c.append(el("button",{type:"button",class:"addk",onclick:()=>openTask(null,{fase:f.k})},"+ Adicionar tarefa"));
      drop(c,id=>changeFase(id,f.k));k.append(c);});}
  function renderLista(){const v=$("vLista");v.textContent="";const L=sortT(filtered());
    FASES.forEach(f=>{const items=L.filter(t=>faseOf(t).k===f.k);
      const g=el("div",{class:"lgroup",style:`--c:var(${f.c})`},el("header",null,el("i",{class:"dot",style:`--c:var(${f.c})`}),el("b",null,f.n),el("span",null,items.length),el("button",{type:"button",class:"btn",style:"padding:5px 10px;font-size:12.5px",onclick:()=>openTask(null,{fase:f.k})},"+ Tarefa")));
      if(!items.length)g.append(el("div",{class:"lempty"},"Nenhuma tarefa nesta fase."));
      else{const tb=el("tbody");items.forEach(t=>tb.append(el("tr",{tabindex:"0",onclick:()=>openTask(t),onkeydown:e=>{if(e.key==="Enter")openTask(t);}},
        el("td",{class:"tt"},t.titulo||"Sem nome"),el("td",null,avs(t)),el("td",null,priTag(t)),el("td",{class:"due"},fd(t.inicio)||"—"),el("td",null,dueEl(t)||el("span",{class:"due"},"—")),el("td",null,cmts(t)||""))));
        g.append(el("div",{class:"tw"},el("table",null,el("thead",null,el("tr",null,...["Tarefa","Responsáveis","Prioridade","Início","Entrega","Comentários"].map(h=>el("th",null,h)))),tb)));}
      v.append(g);});}
  function renderCal(){$("mTitle").textContent=`${MESES[M]} ${Y}`;const dw=$("dow");dw.textContent="";DOW.forEach(d=>dw.append(el("div",null,d)));
    const g=$("grid");g.textContent="";const lead=(new Date(Y,M,1).getDay()+6)%7, days=new Date(Y,M+1,0).getDate(), L=sortT(filtered()), td=hoje();
    for(let i=0;i<lead;i++)g.append(el("div",{class:"day out"}));
    for(let d=1;d<=days;d++){const s=isoD(Y,M,d), items=L.filter(t=>t.entrega===s);
      const c=el("div",{class:"day"+(s===td?" today":"")+(items.length?"":" blank")},el("span",{class:"num"},pad(d)));
      items.forEach(t=>{const f=faseOf(t);c.append(el("button",{type:"button",class:"chip"+(f.k==="realizado"?" done":""),style:`--c:var(${priOf(t).c})`,draggable:"true",title:`${t.titulo} · ${f.n} · ${priOf(t).n}`,
        onclick:()=>openTask(t),ondragstart:e=>e.dataTransfer.setData("text/plain",t.id)},el("span",null,t.titulo||"Sem nome"),el("small",{class:"fase",style:`color:var(${f.c})`},f.n)));});
      drop(c,id=>{const t=tasks.find(x=>x.id===id);if(t&&t.entrega!==s)patch(t,{entrega:s},{tipo:"entrega",de:t.entrega||"",para:s});});
      g.append(c);}
    const tail=(7-(lead+days)%7)%7;for(let i=0;i<tail;i++)g.append(el("div",{class:"day out"}));
    const sem=L.filter(t=>!t.entrega).length; if(sem)$("grid").after(el("p",{class:"hint",id:"semEnt"},`${sem} tarefa(s) sem data de entrega não aparecem no calendário.`));}
  $("prevM").onclick=()=>{M--;if(M<0){M=11;Y--;}render();};
  $("nextM").onclick=()=>{M++;if(M>11){M=0;Y++;}render();};

  function render(){renderStats();fillFilters();
    [...$("viewSeg").children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===view)));
    $("vKanban").hidden=view!=="kanban";$("vLista").hidden=view!=="lista";$("vCal").hidden=view!=="cal";
    const old=$("semEnt");if(old)old.remove();
    if(view==="kanban")renderKanban();else if(view==="lista")renderLista();else renderCal();
    if(!$("overlay").hidden&&editingId){const t=tasks.find(x=>x.id===editingId);if(t){renderComments(t);renderHist(t);renderMeta(t);}}}
  $("viewSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;savePref();render();});

  // gravação com histórico
  const histItem=(o)=>Object.assign({id:uid(),por:me.email,em:new Date().toISOString()},o);
  async function patch(t,fields,hist){const body=Object.assign({},fields);if(hist)body.historico=(t.historico||[]).concat([histItem(hist)]);
    try{await col.doc(t.id).update(body);}catch(_){toast("Não foi possível salvar.");}}
  function changeFase(id,fase){const t=tasks.find(x=>x.id===id);if(!t||t.fase===fase)return;
    patch(t,{fase},{tipo:"fase",faseDe:t.fase,fasePara:fase});toast("Movida para "+by(FASES,fase).n);}

  // card da tarefa
  function buildPriOpts(){const h=$("oPri");h.textContent="";PRI.forEach(p=>h.append(el("label",{class:"opt",style:`--pc:var(${p.c});--pb:var(${p.b})`},el("input",{type:"radio",name:"pri",value:p.k,id:"pri-"+p.k}),el("span",null,"⚑ "+p.n))));}
  function buildRespOpts(sel){const h=$("oResp");h.textContent="";
    if(!users.length)h.append(el("span",{class:"hint"},"Nenhum usuário cadastrado."));
    users.slice().sort((a,b)=>(a.nome||a.email).localeCompare(b.nome||b.email)).forEach(u=>h.append(el("label",{class:"opt"},el("input",{type:"checkbox",name:"resp",value:u.email,id:"resp-"+Auth.docId(u.email),checked:(sel||[]).includes(u.email)?true:null}),el("span",null,el("i",{class:"av"},ini(u.nome||u.email)),u.nome||u.email))));}
  const fillSel=(id,items,val)=>{const s=$(id);s.textContent="";items.forEach(i=>s.append(el("option",{value:i.k},i.n)));if(val!=null)s.value=val;};
  function renderMeta(t){$("meta").textContent=t?`Criada por ${userName(t.criadoPor)||"—"}${t.criadoEm?" em "+fdt(t.criadoEm):""}${t.atualizadoEm?" · atualizada em "+fdt(t.atualizadoEm):""}`:"Nova tarefa · preencha e clique em Salvar";}
  function renderComments(t){const l=$("cList");l.textContent="";const cs=(t&&t.comentarios)||[];
    $("cCount").textContent=cs.length?`${cs.length}`:"";
    if(!cs.length)l.append(el("p",{class:"hint"},t?"Nenhum comentário ainda.":"Salve a tarefa para comentar."));
    cs.forEach(c=>l.append(el("div",{class:"cm"},el("span",{class:"av"},ini(userName(c.autor))),el("div",{class:"bx"},el("b",null,userName(c.autor)),el("time",null,fdt(c.em)),el("p",null,c.texto)))));}
  function renderHist(t){const h=$("hList");h.textContent="";const H=((t&&t.historico)||[]).slice().reverse();
    if(!H.length){h.append(el("p",{class:"hint",style:"margin:0"},"Sem movimentações."));return;}
    const ul=el("ul");H.forEach(x=>{let txt;
      if(x.tipo==="transferencia")txt=[el("b",null,userName(x.de)||"—")," → ",el("b",null,userName(x.para))," · fase ",el("b",null,(by(FASES,x.faseDe)||{n:"—"}).n)," → ",el("b",null,(by(FASES,x.fasePara)||{n:"—"}).n),x.nota?` · “${x.nota}”`:""];
      else if(x.tipo==="fase")txt=["Fase ",el("b",null,(by(FASES,x.faseDe)||{n:"—"}).n)," → ",el("b",null,(by(FASES,x.fasePara)||{n:"—"}).n)];
      else if(x.tipo==="entrega")txt=["Entrega ",el("b",null,fd(x.de)||"—")," → ",el("b",null,fd(x.para))];
      else if(x.tipo==="criada")txt=["Tarefa criada"];
      else txt=[x.tipo||"Alteração"];
      ul.append(el("li",null,...txt,` · ${userName(x.por)} · ${fdt(x.em)}`));});h.append(ul);}
  function syncTransfer(t){const resp=(t&&t.responsaveis)||[];
    fillSel("tDe",[{k:"",n:"Ninguém (sem responsável)"}].concat(resp.map(e=>({k:e,n:userName(e)}))),resp.includes(me.email)?me.email:(resp[0]||""));
    fillSel("tPara",users.map(u=>({k:u.email,n:u.nome||u.email})),"");
    fillSel("tFase",FASES,t?faseOf(t).k:"ideia");
    const on=!!t; ["tDe","tPara","tFase","tNota","tBtn"].forEach(id=>$(id).disabled=!on); ["cTxt","cBtn"].forEach(id=>$(id).disabled=!on);
    $("tHint").textContent=on?"":"Salve a tarefa para poder transferir.";}

  function openTask(t,preset){editingId=t?t.id:null;$("formErr").hidden=true;
    $("iTitulo").value=t?t.titulo||"":""; fillSel("iFase",FASES,t?faseOf(t).k:(preset&&preset.fase)||"a_fazer");
    buildPriOpts(); const pk=t?priOf(t).k:"normal"; document.querySelectorAll("input[name=pri]").forEach(i=>i.checked=i.value===pk);
    $("iIni").value=t?t.inicio||"":hoje(); $("iEnt").value=t?t.entrega||"":(preset&&preset.entrega)||"";
    buildRespOpts(t?t.responsaveis:[me.email]); $("iDesc").value=t?t.descricao||"":""; $("iBrief").value=t?t.briefing||"":"";
    $("cTxt").value=""; $("tNota").value=""; syncTransfer(t); renderComments(t); renderHist(t); renderMeta(t); renderDel();
    $("overlay").hidden=false; setTimeout(()=>$("iTitulo").focus(),40);}
  function closeTask(){$("overlay").hidden=true;editingId=null;}
  $("closeBtn").onclick=closeTask;$("cancelBtn").onclick=closeTask;$("newBtn").onclick=()=>openTask(null);
  $("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeTask();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeTask();});
  function renderDel(confirm){const a=$("delArea");a.textContent="";if(!editingId)return;
    if(!confirm){a.append(el("button",{class:"btn danger",type:"button",onclick:()=>renderDel(true)},"Excluir"));return;}
    a.append(el("div",{class:"confirm"},"Excluir esta tarefa?",el("button",{class:"btn danger",type:"button",onclick:async()=>{await col.doc(editingId).delete();closeTask();toast("Tarefa excluída");}},"Sim, excluir"),el("button",{class:"btn",type:"button",onclick:()=>renderDel(false)},"Não")));}

  $("form").addEventListener("submit",async e=>{e.preventDefault();const err=m=>{$("formErr").textContent=m;$("formErr").hidden=false;};
    const titulo=$("iTitulo").value.trim(); if(!titulo)return err("Dê um nome para a tarefa.");
    const ini_=$("iIni").value, ent=$("iEnt").value; if(ini_&&ent&&ent<ini_)return err("A data de entrega precisa ser depois do início.");
    const body={titulo,fase:$("iFase").value,prioridade:(document.querySelector("input[name=pri]:checked")||{}).value||"normal",inicio:ini_,entrega:ent,
      responsaveis:[...document.querySelectorAll("input[name=resp]:checked")].map(i=>i.value),descricao:$("iDesc").value.trim(),briefing:$("iBrief").value.trim()};
    const btn=$("saveBtn");btn.disabled=true;
    try{if(editingId){const t=tasks.find(x=>x.id===editingId);const H=[];
        if(t.fase!==body.fase)H.push(histItem({tipo:"fase",faseDe:t.fase,fasePara:body.fase}));
        if((t.entrega||"")!==body.entrega)H.push(histItem({tipo:"entrega",de:t.entrega||"",para:body.entrega}));
        if(H.length)body.historico=(t.historico||[]).concat(H);
        await col.doc(editingId).update(body);toast("Tarefa salva");}
      else{body.criadoPor=me.email;body.comentarios=[];body.historico=[histItem({tipo:"criada"})];const r=await col.add(body);editingId=r.id;toast("Tarefa criada");
        const t=Object.assign({id:r.id},body);syncTransfer(t);renderComments(t);renderHist(t);renderMeta(t);renderDel();}}
    catch(_){err("Não foi possível salvar. Tente de novo.");}finally{btn.disabled=false;}});

  $("cBtn").onclick=async()=>{const txt=$("cTxt").value.trim();if(!txt||!editingId)return;const t=tasks.find(x=>x.id===editingId);
    const cs=(t.comentarios||[]).concat([{id:uid(),autor:me.email,texto:txt,em:new Date().toISOString()}]);
    try{await col.doc(editingId).update({comentarios:cs});$("cTxt").value="";toast("Comentário publicado");}catch(_){toast("Não foi possível comentar.");}};
  $("tBtn").onclick=async()=>{if(!editingId)return;const t=tasks.find(x=>x.id===editingId);const de=$("tDe").value,para=$("tPara").value,fase=$("tFase").value,nota=$("tNota").value.trim();
    if(!para)return toast("Escolha para quem transferir.");if(de===para)return toast("Escolha um colaborador diferente.");
    const resp=(t.responsaveis||[]).filter(e=>e!==de);if(!resp.includes(para))resp.push(para);
    await patch(t,{responsaveis:resp,fase},{tipo:"transferencia",de,para,faseDe:t.fase,fasePara:fase,nota});
    $("iFase").value=fase;buildRespOpts(resp);$("tNota").value="";toast(`Transferida para ${userName(para)}`);
    const nt=Object.assign({},t,{responsaveis:resp,fase});syncTransfer(nt);};

  Central.boot("tarefas",user=>{me=user;loadPref();
    col=Store.collection("tarefas");
    Store.collection("usuarios").onSnapshot(sn=>{users=sn.docs.map(d=>d.data()).filter(u=>u.email);render();});
    col.onSnapshot(sn=>{tasks=sn.docs.map(d=>Object.assign({id:d.id},d.data()));render();});
    render();});
})();
</script>
</body>
