<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel · Central de Marketing</title>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/qnr0hwt.css">
<link rel="stylesheet" href="assets/css/base.css">
<style>
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.monthbar{display:flex;align-items:center;gap:8px}
.monthbar b{font-size:18px;min-width:160px;text-align:center;text-transform:capitalize}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer}
.apv{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--warn);border-left:6px solid var(--accent);border-radius:12px;padding:14px 18px;text-decoration:none;color:var(--fg)}
.apv:hover{box-shadow:0 2px 10px -4px rgba(0,0,0,.2)}
.apv .ic{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.apv .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.apv .tx b{font-size:16px}
.apv .tx small{font-size:12.5px;color:var(--muted)}
.apv .go{font-weight:700;color:var(--accent);white-space:nowrap;font-size:14px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mod header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mod h2{font-size:18px}
.mod header a{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.kpi{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi b{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13.5px}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font-size:13.5px;align-items:center}
.row b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--c);vertical-align:0}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.agenda h2{font-size:18px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dcol{background:var(--bg);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:120px}
.dcol .dh{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dcol.today{outline:2px solid var(--accent);outline-offset:-2px}
.it{display:block;text-decoration:none;color:var(--fg);background:var(--surface);border-left:3px solid var(--c);border-radius:5px;padding:4px 6px;font-size:12px;line-height:1.25}
.it small{display:block;color:var(--muted);font-size:10.5px;font-weight:600}
.it span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.none{color:var(--muted);font-size:12px}
.mod header .ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.per{font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.tile{background:var(--bg);border-radius:9px;padding:9px 10px;min-width:0}
.tile b{display:block;font-size:19px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.tiles.q4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tiles.q4 .tile{padding:8px}
.tiles.q4 .tile b{font-size:17px}
.tile small{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b.up{color:var(--ok)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.leg b{color:var(--fg);font-family:var(--mono);font-weight:500}
.foot{font-size:11.5px;color:var(--muted)}
.dl{font-size:11.5px;font-family:var(--mono);margin-left:6px}
.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}
.btn-s{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--fg)}
.btn-s.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.sec{display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line);padding-top:12px}
.sec .tile span,.sec .tile small{white-space:normal;overflow-wrap:anywhere}
.tiles.q3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tiles.q3 .tile{padding:8px}.tiles.q3 .tile b{font-size:17px}
.rdbox{display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line);padding-top:12px}
.rdbox .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rdbox .hd b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.rdbox .hd span{font-size:12.5px;color:var(--muted)}
.rdbox .est{background:var(--bg);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.rdbox .est b{font-size:14px}
.rdbox .est small{font-size:11.5px;color:var(--muted);line-height:1.35}
.tile small.up{color:var(--ok)}.tile small.dn{color:var(--bad)}
.rdf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rdf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.rdf input{border:1px solid var(--line);border-radius:7px;padding:7px 8px;font:inherit;font-size:14px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.rdf .acts{grid-column:1/-1;display:flex;gap:8px;align-items:center}
@media (max-width:980px){.cols,.cols2{grid-template-columns:1fr}.tiles.q4{grid-template-columns:repeat(2,minmax(0,1fr))}.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header id="app-nav"></header>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow" id="hello">Painel geral</div><h1>Marketing <span>em um só lugar</span></h1></div>
    <div class="monthbar"><button class="icon" type="button" id="prevM" aria-label="Mês anterior">‹</button><b id="mTitle"></b><button class="icon" type="button" id="nextM" aria-label="Próximo mês">›</button></div>
  </div>

  <a class="apv" id="apvAlert" href="aprovacoes.html" hidden></a>

  <div class="cols">
    <section class="mod" id="mEmail"></section>
    <section class="mod" id="mTraf"></section>
    <section class="mod" id="mRedes"></section>
  </div>

  <div class="cols cols2">
    <section class="mod" id="mWa" aria-label="WhatsApp: campanhas de disparo"></section>
    <section class="mod" id="mFun" aria-label="Jornada do site: orçamentos"></section>
  </div>

  <div class="cols cols2">
    <section class="mod" id="mMetaE"></section>
    <section class="mod" id="mMetaA"></section>
  </div>
  <div class="cols cols2">
    <section class="mod" id="mResR" aria-label="Desempenho das redes no mês"></section>
    <section class="mod" id="mResE" aria-label="Resultados dos e-mails no mês"></section>
  </div>

  <section class="agenda">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline"><h2>Próximos 7 dias</h2><span class="hint">E-mails, posts e início/fim de campanhas</span></div>
    <div class="days" id="days"></div>
  </section>
</div>

<script src="assets/js/config.js" charset="utf-8"></script>
<script src="assets/js/marca.js" charset="utf-8"></script>
<script src="assets/js/store.js" charset="utf-8"></script>
<script src="assets/js/auth.js" charset="utf-8"></script>
<script src="assets/js/layout.js" charset="utf-8"></script>
<script src="assets/js/resultados.js" charset="utf-8"></script>
<script src="assets/js/custos.js" charset="utf-8"></script>
<script src="assets/js/whats.js" charset="utf-8"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const pad=n=>String(n).padStart(2,"0");
  const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const brl=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:2});
  const now=new Date(); let Y=now.getFullYear(), M=now.getMonth();
  const D={emails:[],camps:[],posts:[],dias:{},mensais:{}};
  function el(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(typeof v==="function")e.addEventListener(k.replace(/^on/,""),v);else if(k==="style")e.setAttribute("style",v);else if(v!=null)e.setAttribute(k,v);}kids.forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));});return e;}
  const mk=()=>`${Y}-${pad(M+1)}`;
  const execOf=e=>e.execucao||(e.status==="enviado"?"enviado":(e.status==="producao"||e.status==="agendado")?"producao":"nao_enviado");
  const stc=c=>c.statusCampanha||"planejamento";
  const row=(label,val,c)=>el("div",{class:"row"},el("span",null,c?el("i",{class:"dot",style:`--c:${c}`}):null,label),el("b",null,val));
  const meter=parts=>{const t=parts.reduce((s,p)=>s+p[0],0)||1;return el("div",{class:"meter"},...parts.map(([n,c])=>el("i",{style:`width:${n/t*100}%;background:${c}`})));};
  const head=(t,href,per)=>el("header",null,el("div",{class:"ttl"},el("h2",null,t),per?el("span",{class:"per"},per):null),href?el("a",{href},"Abrir ›"):null);
  const num=v=>(+v||0).toLocaleString("pt-BR");
  const brl0=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
  const curto=v=>{v=+v||0;return Math.abs(v)>=10000?`${(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})} mil`:num(v);};
  const put=(m,...k)=>m.append(...k.filter(x=>x!=null&&x!==false));
  const dm=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}`:"";
  const addD=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);};
  const segDe=s=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d);};
  const mkAnt=k=>{const d=k?new Date(+k.slice(0,4),+k.slice(5,7)-2,1):new Date(Y,M-1,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
  const fimMes=()=>`${mk()}-${pad(new Date(Y,M+1,0).getDate())}`;
  // "Mês · novembro até 16/11" (até onde os números chegam)
  const perMes=ate=>`Mês · ${MESES[M]}${ate&&ate<fimMes()?" até "+dm(ate):""}`;
  const tile=(v,l,extra,cls)=>el("div",{class:"tile"},el("b",cls?{class:cls}:null,v),el("span",null,l),extra?el("small",null,extra):null);

  function renderEmail(){const m=$("mEmail"),fica=rdEdit?$("rdBox"):null;m.textContent="";
    const L=D.emails.filter(e=>(e.data||"").slice(0,7)===mk()); const n=L.length;
    const c=k=>L.filter(e=>execOf(e)===k).length, env=c("enviado"), pro=c("producao"), nao=c("nao_enviado");
    const hoje=iso(new Date()), atr=L.filter(e=>e.data<hoje&&execOf(e)!=="enviado").length;
    m.append(head("E-mail marketing","emails.html",perMes()),
      el("div",{class:"kpi"},el("b",null,`${env}/${n}`),el("span",null,`realizado × planejado · ${n?Math.round(env/n*100):0}%`)),
      meter([[env,"var(--ok)"],[pro,"var(--warn)"],[nao,"var(--bad)"]]),
      el("div",{class:"rows"},row("Enviados",env,"var(--ok)"),row("Em produção",pro,"var(--warn)"),row("Não enviados",nao,"var(--bad)"),row("Atrasados (data já passou)",atr)),
      fica||el("div",{class:"rdbox",id:"rdBox","aria-label":"Situação da base do RD Station"}));
    if(!fica)renderRD();}
  function renderTraf(){const m=$("mTraf");m.textContent="";
    const ini=`${mk()}-01`, fim=fimMes();
    const L=D.camps.filter(c=>!c.inicio||!c.fim?true:(c.inicio<=fim&&c.fim>=ini));
    const vp=L.reduce((s,c)=>s+(+c.verba||0),0);
    const A=D.mensais["metaads-"+mk()];
    if(!A){ // sem números do Meta neste mês: usa o investido lançado nas campanhas
      const vi=L.reduce((s,c)=>s+(+c.verbaInvestida||0),0), k=s=>L.filter(c=>stc(c)===s).length;
      m.append(head("Tráfego pago","trafego.html",perMes()),
        el("div",{class:"kpi"},el("b",null,brl(vi)),el("span",null,`investidos no mês de ${brl(vp)} projetados · ${vp?Math.round(vi/vp*100):0}%`)),
        meter([[vi,"var(--ok)"],[Math.max(0,vp-vi),"var(--surface-2)"]]),
        el("div",{class:"rows"},row("Ativas",k("ativa"),"var(--ok)"),row("Em planejamento",k("planejamento"),"var(--warn)"),row("Inativas",k("inativa"),"var(--muted)")),
        el("p",{class:"foot"},"Sem números do Meta Ads neste mês: valor lançado nas campanhas."));
      return;}
    const t=A.totais||{}, gasto=+t.gasto||0, lead=x=>(+x.leads||0)+(+x.conversas||0), leads=lead(t), ate=A.ate||fim, dias=A.diario||[];
    const soma=(a,b)=>dias.filter(d=>d.data>=a&&d.data<=b).reduce((o,d)=>{o.g+=+d.gasto||0;o.l+=lead(d);return o;},{g:0,l:0});
    const s1=segDe(ate)<ini?ini:segDe(ate), w=soma(s1,ate), p0=addD(segDe(ate),-7), w0=segDe(ate)>ini?soma(p0<ini?ini:p0,addD(segDe(ate),-1)):null;
    const ativas=(A.campanhas||[]).filter(c=>c.status==="ACTIVE").length, cpl=(g,l)=>l?brl0(g/l):"—", ant=v=>w0?`sem. ant. ${v}`:null;
    put(m,head("Tráfego pago","trafego.html",perMes(ate)),
      el("div",{class:"kpi"},el("b",null,brl(gasto)),el("span",null,vp?`investidos de ${brl(vp)} projetados · ${Math.round(gasto/vp*100)}%`:"investidos no mês (Meta Ads)")),
      meter(vp?[[Math.min(gasto,vp),"var(--ok)"],[Math.max(0,vp-gasto),"var(--surface-2)"]]:[[1,"var(--ok)"]]),
      el("div",{class:"rows"},row("Leads no mês (formulário + WhatsApp)",num(leads),"var(--ok)"),row("Custo por lead",leads?brl(gasto/leads):"—","var(--info)"),
        row("Pessoas alcançadas pelos anúncios",curto(t.alcance),"var(--accent)"),row("Campanhas ativas no Meta",num(ativas))),
      el("div",{class:"sec"},el("div",{class:"sub"},`Esta semana · ${dm(s1)} a ${dm(ate)}`),
        el("div",{class:"tiles q3"},tile(brl0(w.g),"investidos",ant(w0&&brl0(w0.g))),tile(num(w.l),"leads",ant(w0&&num(w0.l))),tile(cpl(w.g,w.l),"custo por lead",ant(w0&&cpl(w0.g,w0.l))))));}
  function renderRedes(){const m=$("mRedes");m.textContent="";
    const L=D.posts.filter(p=>(p.data||"").slice(0,7)===mk());
    const S=[["ideia","Ideia","var(--muted)"],["producao","Em produção","var(--warn)"],["programado","Programado","var(--info)"],["postado","Postado","var(--ok)"],["derrubado","Derrubado","var(--bad)"]];
    const c=k=>L.filter(p=>(p.status||"ideia")===k).length;
    const R=D.mensais["social-"+mk()], ig=R&&R.redes&&R.redes.instagram, li=R&&R.redes&&R.redes.linkedin;
    const O=["postado","programado","producao","ideia","derrubado"].map(k=>S.find(s=>s[0]===k)), vis=O.filter(s=>s[0]!=="derrubado"||c("derrubado"));
    m.append(head("Redes sociais","redes.html",perMes(R&&R.ate)),
      el("div",{class:"kpi"},el("b",null,`${c("postado")}/${L.length}`),el("span",null,`posts publicados no mês · ${L.length?Math.round(c("postado")/L.length*100):0}%`)),
      meter(O.map(s=>[c(s[0]),s[2]])),
      el("div",{class:"rows"},...vis.map(s=>row(s[1],c(s[0]),s[2]))));
    if(ig){const mais=v=>(+v>0?"+":"")+num(v);
      m.append(el("div",{class:"sec"},el("div",{class:"sub"},`Instagram e LinkedIn no mês${R.ate?" · até "+dm(R.ate):""}`),
        el("div",{class:"tiles q4"},tile(mais(ig.novos),"seguidores IG",ig.seguidores?`total ${curto(ig.seguidores)}`:null,+ig.novos>0?"up":null),
          tile(curto(ig.interacoes!=null?ig.interacoes:(+ig.curtidas||0)+(+ig.comentarios||0)+(+ig.compartilhamentos||0)),"interações IG"),
          tile(curto(ig.curtidas),"curtidas IG"),
          li?tile(mais(li.novos),"seguidores LinkedIn",li.seguidores?`total ${curto(li.seguidores)}`:null,+li.novos>0?"up":null):tile(num(ig.compartilhamentos),"compart. IG"))));}
    else m.append(el("p",{class:"foot"},"Seguidores e interações do mês chegam pela rotina do mLabs."));}
  /* Base do RD Station: foto do mês (metas_mensais/rdbase-AAAA-MM), comparada com a do mês anterior.
     O administrador digita os números que o RD mostra em Contatos › Base de Leads (ou a rotina grava). */
  let rdEdit=false;
  /* Base do RD: a FOTO (números reais digitados do RD, metas_mensais/rdbase-AAAA-MM) e a SAÚDE pelos disparos
     (metas_mensais/rdsaude, gravado pela rotina do RD: números de cada disparo, sem contatos).
     Estimativa da semana: a proporção de ativos da última foto, corrigida pela variação das taxas de abertura e
     clique dos últimos 28 dias em relação aos 28 dias antes da foto. A foto seguinte recalibra. */
  const rdJanela=fim=>{const ini=addD(fim,-27),L=((D.mensais.rdsaude||{}).d||[]).filter(x=>x[0]>=ini&&x[0]<=fim);
    const t=L.reduce((o,x)=>{o.n++;o.c+=x[1];o.e+=x[2];o.a+=x[3];o.k+=x[4];o.b+=x[5];o.x+=x[6];o.u+=x[7];o.s+=x[8];return o;},{n:0,c:0,e:0,a:0,k:0,b:0,x:0,u:0,s:0});
    t.ini=ini;t.fim=fim;t.ab=t.e?t.a/t.e:0;t.cl=t.e?t.k/t.e:0;t.suj=t.c?(t.b+t.x)/t.c:0;return t;};
  const pp=v=>`${(v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})}%`;
  const fotoAte=lim=>Object.keys(D.mensais).filter(k=>k.indexOf("rdbase-")===0&&k.slice(7)<=lim).sort().pop();
  function renderRD(){const m=$("rdBox");if(!m||rdEdit)return;m.textContent="";
    const kR=fotoAte(mk()), R=kR?D.mensais[kR]:null, kP=R?fotoAte(mkAnt.call(null,kR.slice(7))):null, P=kP&&kP!==kR?D.mensais[kP]:null;
    const C=[["ativos","Ativos","var(--ok)"],["indeterminados","Indeterminados","var(--warn)"],["desengajados","Desengajados","var(--bad)"]];
    const adm=window.Custos&&Custos.isAdmin(), doMes=R&&kR==="rdbase-"+mk();
    const bt=adm?el("button",{type:"button",class:"btn-s",onclick:()=>formRD(R)},doMes?"Atualizar foto do RD":`Lançar foto de ${MESES[M]}`):null;
    const RS=D.mensais.rdsaude, fimV=RS&&RS.ate?(RS.ate<fimMes()?RS.ate:fimMes()):null, J=fimV?rdJanela(fimV):null, J0=fimV?rdJanela(addD(fimV,-28)):null;
    m.append(el("div",{class:"sub"},"Base do RD Station"));
