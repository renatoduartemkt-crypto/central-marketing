<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eventos · Central de Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<style>
/* Layout: alertas de vencimento de todos os eventos → seletor de eventos → evento escolhido com abas (Visão geral, Checklist, Orçamentos, Verba e custos) */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:16px;margin:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input[type=text],input[type=date],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--fg);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.money{font-family:var(--mono);text-align:right}
.lab{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
/* alertas */
.alerts{display:flex;flex-direction:column;gap:6px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:0;border-left:4px solid var(--c);background:var(--bg);border-radius:8px;padding:8px 12px;text-align:left;cursor:pointer;color:var(--fg);width:100%}
.al:hover{background:var(--surface-2)}
.al .tg{font-size:11px;font-weight:800;border-radius:4px;padding:2px 7px;background:var(--cb);color:var(--c);white-space:nowrap}
.al .tx{min-width:0}
.al .tx b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al .tx small{color:var(--muted);font-size:12px}
.al .dt{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.al.bad{--c:var(--bad);--cb:var(--bad-bg)}.al.warn{--c:var(--warn);--cb:var(--warn-bg)}.al.info{--c:var(--info);--cb:var(--info-bg)}
.alsum{display:flex;gap:8px;flex-wrap:wrap}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;background:var(--cb);color:var(--c)}
.pill.bad{--c:var(--bad);--cb:var(--bad-bg)}.pill.warn{--c:var(--warn);--cb:var(--warn-bg)}.pill.info{--c:var(--info);--cb:var(--info-bg)}.pill.ok{--c:var(--ok);--cb:var(--ok-bg)}
/* seletor de eventos */
.evbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ev{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.ev:hover{border-color:var(--muted)}
.ev[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ev b{font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.ev .r{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.ev .cd{font-family:var(--mono);font-size:12px;font-weight:500;white-space:nowrap}
.mini{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mini i{display:block;height:100%;background:var(--c,var(--ok))}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px;color:var(--muted);text-align:center}
.empty strong{color:var(--fg);display:block;font-size:16px;margin-bottom:4px}
/* evento */
.evh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.evh h2{font-size:22px;color:var(--navy);margin:0 0 4px}
.evh .meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:13.5px}
.evh .meta b{color:var(--fg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--mono);font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:1px 6px;margin-left:5px}
/* painel de verba */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:12px 14px;min-width:0}
.kpi small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-family:var(--mono);font-weight:500;font-size:21px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.meter{position:relative;height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--ok));border-radius:7px}
.meterl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px;gap:8px;flex-wrap:wrap}
.meterl b{color:var(--fg);font-family:var(--mono);font-weight:500}
.ccs{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.cc{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.cc .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .v{font-family:var(--mono);font-size:12.5px;white-space:nowrap;text-align:right}
.cc .v.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
/* checklist */
.addrow{display:grid;grid-template-columns:minmax(0,2fr) 150px minmax(0,1fr) auto;gap:8px;align-items:end}
.cl{display:flex;flex-direction:column}
.ci{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto 34px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci input[type=checkbox]{width:19px;height:19px;accent-color:var(--ok);cursor:pointer}
.ci .tx{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.ci.done .tx{text-decoration:line-through;color:var(--muted);font-weight:500}
.ci .who2{font-size:12.5px;color:var(--muted);white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.due{font-family:var(--mono);font-size:12px;border-radius:5px;padding:2px 7px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.due.bad{background:var(--bad-bg);color:var(--bad);font-weight:600}.due.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}.due.info{background:var(--info-bg);color:var(--info)}.due.ok{background:var(--ok-bg);color:var(--ok)}
.del{border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer;border-radius:6px;width:30px;height:30px}
.del:hover{background:var(--bad-bg);color:var(--bad)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .mini{flex:1;height:8px}
/* orçamentos */
.items{display:flex;flex-direction:column;gap:14px}
.oi{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.oih{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.oih input.nm{flex:1;min-width:180px;font-weight:700;font-size:15px;background:var(--surface)}
.oih .q{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700}
.oih .q input{width:80px;text-align:right;background:var(--surface)}
.oih .q input.un{width:90px;text-align:left}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.qt{min-width:820px}
.qt input{padding:7px 8px;font-size:13.5px}
.qt td.tot{font-family:var(--mono);white-space:nowrap;font-weight:600}
.qt tr.best td{background:var(--ok-bg)}
.qt tr.best td.tot{color:var(--ok)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:var(--ok);color:#fff;white-space:nowrap}
.badge.ch{background:var(--navy)}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.pick[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.res{padding:12px 14px;display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;font-size:13.5px;border-top:1px solid var(--line)}
.res b{font-family:var(--mono);font-weight:600}
.res .win{color:var(--ok);font-weight:700}
.oif{padding:10px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
/* verba e custos */
.subtabs{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.subtabs button{border:0;background:transparent;border-radius:7px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.frm{display:grid;gap:10px;align-items:end}
.frm.v{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 160px auto}
.frm.c{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 130px 150px 150px auto}
.frm .full{grid-column:1/-1}
.lt td{padding:9px 10px}
.lt td.money{white-space:nowrap}
.lt tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
.over{color:var(--bad);font-weight:700}
/* contratos e aditivos */
.cts{display:flex;flex-direction:column;gap:14px}
.ct{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.cth{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.cth b{font-size:15px}.cth .hint{display:block;margin-top:2px}
.ctn{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.ctn div{background:var(--surface);padding:9px 12px;min-width:0}
.ctn small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.ctn b{font-family:var(--mono);font-weight:500;font-size:14.5px;white-space:nowrap}
.ctn .up{color:var(--warn)}.ctn .bad{color:var(--bad)}.ctn .ok{color:var(--ok)}
.adt td{padding:7px 10px}
.adt select{width:auto;padding:5px 8px;font-size:12.5px;font-weight:700}
.adt select.st-pendente{color:var(--warn);border-color:var(--warn)}.adt select.st-aprovado{color:var(--ok);border-color:var(--ok)}.adt select.st-recusado{color:var(--muted);text-decoration:line-through}
.adf{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 130px 140px 140px auto;gap:8px;align-items:end;padding:12px 14px;border-top:1px solid var(--line);background:var(--bg)}
.adf input,.adf select{background:var(--surface)}
.ctf{padding:10px 14px;display:flex;justify-content:flex-end;border-top:1px solid var(--line)}
.meter .cm{background:var(--c2,var(--info));opacity:.35}
@media (max-width:900px){.ctn{grid-template-columns:repeat(3,minmax(0,1fr))}.adf{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.ctn{grid-template-columns:1fr 1fr}.adf{grid-template-columns:1fr}}
/* painel lateral (formulário do evento) */
.overlay{position:fixed;inset:0;background:rgba(10,16,28,.45);display:flex;justify-content:flex-end;z-index:20}
.panel{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column}
.ph{position:sticky;top:0;background:var(--surface);padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.ph h2{font-size:19px;margin:0}
.x{border:0;background:var(--surface-2);border-radius:7px;width:32px;height:32px;font-size:18px;cursor:pointer}
.pb{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pb .full{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:700;background:var(--surface);cursor:pointer}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pf{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto}
.err{color:var(--bad);font-size:13px;font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
@media (max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .frm.c{grid-template-columns:1fr 1fr}
  .frm.v{grid-template-columns:1fr 1fr}
  .addrow{grid-template-columns:1fr 1fr}
  .addrow .grow{grid-column:1/-1}
}
@media (max-width:560px){
  .pb{grid-template-columns:1fr}
  .ci{grid-template-columns:28px minmax(0,1fr) 34px}
  .ci .due,.ci .who2{grid-column:2}
  .ci .del{grid-row:1;grid-column:3}
  .cc{grid-template-columns:1fr auto}.cc .mini{grid-column:1/-1;grid-row:2}
  .frm.c,.frm.v{grid-template-columns:1fr}
  .kpi b{font-size:16px}
  .al{grid-template-columns:minmax(0,1fr) auto}.al .tg{grid-column:1/-1;justify-self:start}
}
</style>
</head>
<body>
<header id="app-nav"></header>
<div class="wrap">
  <div class="top">
    <div><div class="eyebrow">Planejamento e controle de eventos</div><h1>Eventos <span>da equipe</span></h1></div>
    <button class="btn primary" type="button" id="newEv">+ Novo evento</button>
  </div>

  <section class="card" id="alertCard">
    <div class="ch"><h2>Alertas de vencimento</h2><div class="alsum" id="alSum"></div></div>
    <div class="alerts" id="alerts"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="evbar">
      <div class="seg" id="evFilter" role="group" aria-label="Mostrar eventos">
        <button type="button" data-f="prox" aria-pressed="true">Próximos</button>
        <button type="button" data-f="pass" aria-pressed="false">Realizados</button>
        <button type="button" data-f="all" aria-pressed="false">Todos</button>
      </div>
    </div>
    <div class="evs" id="evs"></div>
  </section>

  <section id="evArea" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="card evh" id="evHead"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-t="geral" aria-selected="true">Visão geral</button>
      <button type="button" role="tab" data-t="check" aria-selected="false">Checklist</button>
      <button type="button" role="tab" data-t="orc" aria-selected="false">Orçamentos</button>
      <button type="button" role="tab" data-t="custos" aria-selected="false">Verba e custos</button>
    </div>
    <div id="tabBody" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>
</div>

<datalist id="dlCentros"></datalist>
<datalist id="dlForn"></datalist>
<datalist id="dlTipos"><option value="Feirão de negócios"><option value="Portas Abertas"><option value="Jantar de negócios"><option value="Treinamento / palestra"><option value="Feira externa"><option value="Confraternização"><option value="Visita técnica"></datalist>

<div class="overlay" id="overlay" hidden>
  <form class="panel" id="evForm" novalidate>
    <div class="ph"><h2 id="fTitle">Novo evento</h2><button class="x" type="button" id="fClose" aria-label="Fechar">×</button></div>
    <div class="pb">
      <div class="full"><label class="lab" for="eNome">Nome do evento</label><input type="text" id="eNome" maxlength="120" placeholder="Ex.: Feirão de Negócios MT"></div>
      <div><label class="lab" for="eTipo">Tipo</label><input type="text" id="eTipo" list="dlTipos" maxlength="60" placeholder="Escolha ou escreva"></div>
      <div><label class="lab" for="eLocal">Local / cidade</label><input type="text" id="eLocal" maxlength="120"></div>
      <div><label class="lab" for="eIni">Data do evento</label><input type="date" id="eIni"></div>
      <div><label class="lab" for="eFim">Término (se mais de um dia)</label><input type="date" id="eFim"></div>
      <div class="full"><span class="lab">Empresa</span><div class="opts" id="eEmp"></div></div>
      <div class="full"><span class="lab">Responsáveis</span><div class="opts" id="eResp"></div></div>
      <div class="full"><label class="lab" for="eCc">Centro de custo do setor (Metas e custos)</label><select id="eCc"></select></div>
      <div class="full"><label class="lab" for="eNotas">Observações</label><textarea id="eNotas" maxlength="2000"></textarea></div>
      <div class="full" id="tplBox"><label class="opt"><input type="checkbox" id="eTpl" checked><span>Começar com o checklist padrão de eventos (prazos calculados pela data do evento)</span></label></div>
      <p class="err full" id="fErr" hidden></p>
    </div>
    <div class="pf"><div id="fDel"></div><div style="display:flex;gap:8px"><button class="btn" type="button" id="fCancel">Cancelar</button><button class="btn primary" type="submit" id="fSave">Salvar</button></div></div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="assets/js/config.js" charset="utf-8"></script>
<script src="assets/js/marca.js" charset="utf-8"></script>
<script src="assets/js/store.js" charset="utf-8"></script>
<script src="assets/js/auth.js" charset="utf-8"></script>
<script src="assets/js/layout.js" charset="utf-8"></script>
<script src="assets/js/custos.js" charset="utf-8"></script>
<script src="assets/js/relatorio.js" charset="utf-8"></script>
<script>
(function(){
  const EMP=[{k:"lopes",n:"Distribuidora Lopes"},{k:"opta",n:"Opta Suprimentos"},{k:"a2j",n:"A2J"},{k:"grupo",n:"Grupo Lopes"}];
  const CENTROS_PADRAO=["Locação do espaço","Alimentação / buffet","Estrutura e montagem","Som, luz e atrações","Material gráfico / comunicação","Brindes","Transporte e hospedagem","Equipe / staff","Outros"];
  // checklist padrão: dias em relação à data do evento (negativo = antes)
  const TPL=[["Definir data, local e público do evento",-45],["Aprovar verba projetada",-40],["Pedir orçamentos de fornecedores",-35],["Fechar local / espaço",-30],["Fechar buffet / alimentação",-25],["Enviar convites",-21],["Criar artes e divulgação (redes, e-mail, WhatsApp)",-20],["Contratar som, luz e atrações",-18],["Pedir material gráfico e brindes",-14],["Confirmar presenças",-7],["Confirmar fornecedores e horários",-3],["Montagem e checagem do espaço",-1],["Fotos e registro do evento",0],["Conferir notas fiscais e pagar fornecedores",5],["Relatório final e resultados do evento",7]];
  const $=id=>document.getElementById(id);
  const pad=n=>String(n).padStart(2,"0");
  const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
