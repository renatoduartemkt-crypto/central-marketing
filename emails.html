<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>E-mail marketing · Central de Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<style>
/* Layout: cabeçalho + resumo, depois calendário mensal (seg→dom) que vira agenda em telas estreitas; formulário em painel sobreposto */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEEF4; --line:#D5DCE6;
  --fg:#16233A; --muted:#5C6B82; --navy:#1B2D49; --accent:#E84826; --accent-fg:#FFFFFF;
  --lopes:#1B2D49; --lopes-bg:#E3E9F2; --opta:#0F7A6C; --opta-bg:#DDF1EC;
  --t-desc:#8A5A00; --t-desc-bg:#FBEFD5; --t-nov:#5B3FB8; --t-nov-bg:#ECE6FB;
  --t-of:#C23A1C; --t-of-bg:#FCE4DC; --t-blog:#24679A; --t-blog-bg:#DFEDF8;
  --t-inst:#4F6B1F; --t-inst-bg:#E8EFD8;
  --warn:#9A5B00; --warn-bg:#FFF3D6; --best:#0F7A6C;
  --display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1522; --surface:#152033; --surface-2:#1B2840; --line:#2A3A55;
  --fg:#E7ECF4; --muted:#9AA8BE; --navy:#C9D6EA; --accent:#FF6A45; --accent-fg:#1A0E08;
  --lopes:#C9D6EA; --lopes-bg:#22324E; --opta:#5FD3C0; --opta-bg:#123A35;
  --t-desc:#F2C46A; --t-desc-bg:#3A2D12; --t-nov:#B9A5FF; --t-nov-bg:#2B2350;
  --t-of:#FF9A7E; --t-of-bg:#47201A; --t-blog:#8CC4F0; --t-blog-bg:#16324A;
  --t-inst:#B8D27A; --t-inst-bg:#26301A;
  --warn:#F2C46A; --warn-bg:#3A2D12; --best:#5FD3C0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1522; --surface:#152033; --surface-2:#1B2840; --line:#2A3A55;
  --fg:#E7ECF4; --muted:#9AA8BE; --navy:#C9D6EA; --accent:#FF6A45; --accent-fg:#1A0E08;
  --lopes:#C9D6EA; --lopes-bg:#22324E; --opta:#5FD3C0; --opta-bg:#123A35;
  --t-desc:#F2C46A; --t-desc-bg:#3A2D12; --t-nov:#B9A5FF; --t-nov-bg:#2B2350;
  --t-of:#FF9A7E; --t-of-bg:#47201A; --t-blog:#8CC4F0; --t-blog-bg:#16324A;
  --t-inst:#B8D27A; --t-inst-bg:#26301A;
  --warn:#F2C46A; --warn-bg:#3A2D12; --best:#5FD3C0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;color:var(--navy);line-height:1.05}
h1 span{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--t-of);border-color:var(--t-of)}

.notice{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}

/* resumo */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat h3{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.stat .big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:96px 1fr 26px;align-items:center;gap:8px;font-size:12.5px}
.bar .track{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.bar b{font-family:var(--mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

/* filtros */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.flabel{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}

/* calendário */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:9px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
.dow .best{color:var(--best)}
.day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 7px 9px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.grid .day:nth-child(7n){border-right:0}
.day.out{background:var(--bg);opacity:.55}
.day.weekend{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.day .dh{display:flex;align-items:center;justify-content:space-between;gap:4px}
.day .num{font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.day.today .num{background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:0 5px}
.day .add{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;width:24px;height:24px;border-radius:5px;opacity:0}
.day:hover .add,.day .add:focus-visible{opacity:1}
.day .add:hover{background:var(--surface-2);color:var(--fg)}
.tag{font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 5px;color:var(--warn);background:var(--warn-bg);align-self:flex-start}
.chip{display:flex;flex-direction:column;gap:1px;text-align:left;border:0;border-left:3px solid var(--c);background:var(--cbg);color:var(--fg);border-radius:5px;padding:4px 6px;font-size:12px;line-height:1.25;min-width:0;width:100%}
.chip .l1{display:flex;gap:5px;align-items:center;font-weight:700;color:var(--c);font-size:11px}
.chip .l1 .h{font-family:var(--mono);font-weight:500;color:var(--muted)}
.chip .l2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.sent{opacity:.6}
.chip.sent .l2{text-decoration:line-through}
.chip:hover{filter:brightness(.97)}
.warnday{font-size:10.5px;color:var(--warn);font-weight:600}

/* lista */
.listwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
th{text-align:left;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--c);background:var(--cbg);white-space:nowrap}
.monthbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.monthbar h2{font-size:22px;font-weight:800;min-width:190px;text-transform:capitalize}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;font-size:18px;line-height:1;cursor:pointer}
.pvr{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.pvr .big{font-size:30px}
.meter{grid-column:1/-1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.exsel{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;background:var(--surface);color:var(--fg)}
.flagx{display:inline-flex;align-self:flex-start;align-items:center;gap:4px;font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;color:var(--sc);background:var(--surface)}
.status{font-size:12px;font-weight:600;white-space:nowrap}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--sc);vertical-align:1px}

.empty{padding:34px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-size:17px}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}

/* painel */
.overlay{position:fixed;inset:0;background:rgba(10,16,28,.45);display:flex;justify-content:flex-end;z-index:20}
.panel{background:var(--surface);width:min(460px,100%);height:100%;overflow-y:auto;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h2{font-size:21px;color:var(--navy)}
.x{border:0;background:var(--surface-2);border-radius:7px;width:32px;height:32px;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:12.5px;font-weight:700;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:76px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:13.5px;font-weight:600;background:var(--surface)}
.opt input:checked+span{border-color:var(--c,var(--accent));background:var(--cbg,var(--surface-2));color:var(--c,var(--fg))}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.opt input[type=checkbox]:checked+span::before{content:"✓ ";font-weight:800}
.opt.all span{border-style:dashed}
.repeat{display:flex;flex-direction:column;gap:12px;background:var(--surface-2);border-radius:9px;padding:12px}
.repeat .opt span{background:var(--surface)}
.hint{font-size:12.5px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.err{font-size:13px;color:var(--t-of);font-weight:600}
.panel footer{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.confirm{display:flex;gap:8px;align-items:center;font-size:13.5px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;z-index:30}

@media (max-width:720px){
  .dow{display:none}
  .grid{grid-template-columns:1fr}
  .day{min-height:0;border-right:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .day.out{display:none}
  .day .dh{width:100%}
  .day .add{opacity:1}
  .day .num::after{content:attr(data-dow);margin-left:8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .day.empty-day:not(.today){display:none}
  .chip{width:100%}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="app-nav"></header>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Distribuidora Lopes · Opta · RD Station</div>
      <h1>E-mail <span>marketing</span></h1>
    </div>
    <div class="actions">
      <button class="btn" id="copyBtn" type="button">Copiar tabela</button>
      <button class="btn primary" id="newBtn" type="button">+ Novo e-mail</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="monthbar">
    <button class="icon" type="button" id="prevM" aria-label="Mês anterior">‹</button>
    <h2 id="monthTitle"></h2>
    <button class="icon" type="button" id="nextM" aria-label="Próximo mês">›</button>
    <button class="btn" type="button" id="todayBtn">Mês atual</button>
  </div>

  <section class="summary" id="summary" aria-label="Resumo do mês"></section>

  <div class="toolbar">
    <div class="filters">
      <div><span class="flabel">Empresa</span>
        <div class="seg" id="fEmpresa" role="group" aria-label="Filtrar por empresa"></div></div>
      <div><span class="flabel">Tipo</span>
        <div class="seg" id="fTipo" role="group" aria-label="Filtrar por tipo"></div></div>
      <div><span class="flabel">Estado</span>
        <div class="seg" id="fUF" role="group" aria-label="Filtrar por estado"></div></div>
    </div>
    <div class="seg" id="viewSeg" role="group" aria-label="Visualização">
      <button type="button" data-v="cal" aria-pressed="true">Calendário</button>
      <button type="button" data-v="list" aria-pressed="false">Lista</button>
    </div>
  </div>

  <section id="calView">
    <div class="cal">
      <div class="dow" id="dow"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="listView" hidden>
    <div class="listwrap" id="listWrap"></div>
  </section>

  <div class="legend" id="legend"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="panel" id="form" novalidate>
    <header>
      <h2 id="formTitle">Novo e-mail</h2>
      <button class="x" type="button" id="closeBtn" aria-label="Fechar">×</button>
    </header>

    <div class="row2">
      <div class="field"><label for="fData">Data de envio</label>
        <input type="date" id="fData" required></div>
      <div class="field"><label for="fHora">Horário</label>
        <input type="time" id="fHora" value="06:00"></div>
    </div>
    <p class="hint" id="dayHint"></p>

    <div class="field"><span class="lab">Empresa</span><div class="opts" id="oEmpresa"></div></div>
    <div class="field"><span class="lab">Tipo de e-mail</span><div class="opts" id="oTipo"></div></div>
    <div class="field"><span class="lab">Estados <span class="hint">(marque um ou mais)</span></span>
      <div class="opts" id="oUF"></div></div>
    <div class="field"><span class="lab">Segmentações <span class="hint">(marque uma ou mais)</span></span>
      <div class="opts" id="oSeg"></div></div>

    <div class="field"><label for="fNome">Nome / tema da campanha</label>
      <input type="text" id="fNome" maxlength="120" placeholder="Ex.: Ofertas da Semana MS"></div>
    <div class="field"><label for="fAssunto">Assunto do e-mail</label>
      <input type="text" id="fAssunto" maxlength="160" placeholder="Ex.: Sua semana começou com desconto..."></div>
    <div class="field"><span class="lab">Execução do envio</span>
      <div class="opts" id="oExec"></div>
      <p class="hint">Marque como o e-mail está para medir o planejado × realizado.</p></div>

    <div class="repeat">
      <div class="field"><label for="fRep" id="repLabel">Repetir este e-mail</label>
        <select id="fRep">
          <option value="nao">Não repetir</option>
          <option value="semana">Toda semana, no mesmo dia</option>
          <option value="quinzena">A cada 2 semanas, no mesmo dia</option>
          <option value="uteis">Todo dia útil (seg a sex)</option>
          <option value="dias">Em dias da semana que eu escolher</option>
        </select></div>
      <div class="field" id="repDiasField" hidden><span class="lab">Dias da semana</span><div class="opts" id="oRepDias"></div></div>
      <div class="field" id="repAteField" hidden><label for="fRepAte">Repetir até</label>
        <input type="date" id="fRepAte"></div>
      <p class="hint" id="repPreview"></p>
    </div>
    <div class="field"><label for="fNotas">Observações</label>
      <textarea id="fNotas" maxlength="1000" placeholder="Oferta, link, responsável, briefing..."></textarea></div>

    <p class="err" id="formErr" hidden></p>

    <footer>
      <div id="delArea"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" type="button" id="cancelBtn">Cancelar</button>
        <button class="btn primary" type="submit" id="saveBtn">Salvar</button>
      </div>
    </footer>
  </form>
</div>

<div class="toast" id="toast" hidden></div>
<script src="assets/js/config.js" charset="utf-8"></script>
<script src="assets/js/marca.js" charset="utf-8"></script>
<script src="assets/js/store.js" charset="utf-8"></script>
<script src="assets/js/auth.js" charset="utf-8"></script>
<script src="assets/js/layout.js" charset="utf-8"></script>
<script>
(function(){
  const NOW=new Date(); let YEAR=NOW.getFullYear(), MONTH=NOW.getMonth();
  const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  const EMPRESAS=[{k:"lopes",n:"Lopes",c:"--lopes",b:"--lopes-bg"},{k:"opta",n:"Opta",c:"--opta",b:"--opta-bg"}];
  const TIPOS=[{k:"ofertas",n:"Ofertas",c:"--t-of",b:"--t-of-bg"},{k:"novidades",n:"Novidades",c:"--t-nov",b:"--t-nov-bg"},{k:"blog",n:"Blog",c:"--t-blog",b:"--t-blog-bg"},{k:"institucional",n:"Institucional",c:"--t-inst",b:"--t-inst-bg"},{k:"descadastramento",n:"Descadastramento",c:"--t-desc",b:"--t-desc-bg"}];
  const SEGS=[{k:"engajados",n:"Engajados (quentes)",short:"Engajados"},{k:"novos",n:"Novos leads (frios)",short:"Novos leads"},{k:"indeterminados",n:"Indeterminados",short:"Indetermin."}];
  const UFS=["MS","MT","RO","AC"];
  // compatibilidade com lançamentos antigos (segmentação única)
  const segsOf=e=>Array.isArray(e.segs)?e.segs:(e.seg&&e.seg!=="estado"?[e.seg]:[]);
  const ufsOf=e=>Array.isArray(e.estados)?e.estados:[];
  // flag de execução: mede o planejado × realizado
  const EXEC=[{k:"nao_enviado",n:"Não enviado",c:"--bad",b:"--bad-bg"},{k:"producao",n:"Em produção",c:"--warn",b:"--warn-bg"},{k:"enviado",n:"Enviado",c:"--ok",b:"--ok-bg"}];
  const execOf=e=>e.execucao||(e.status==="enviado"?"enviado":(e.status==="producao"||e.status==="agendado")?"producao":"nao_enviado");
  const HOLIDAYS={"2026-10-12":"Feriado nacional","2026-11-02":"Feriado nacional","2026-11-15":"Feriado nacional","2026-11-20":"Feriado nacional","2026-12-25":"Natal",
    "2027-01-01":"Ano-novo","2027-03-26":"Sexta-feira Santa","2027-04-21":"Feriado nacional","2027-05-01":"Dia do Trabalho","2027-09-07":"Independência","2027-10-12":"Feriado nacional","2027-11-02":"Feriado nacional","2027-11-15":"Feriado nacional","2027-11-20":"Feriado nacional","2027-12-25":"Natal"};
  const DOW=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const BEST=new Set([0,2]); // seg e qua

  function renderCal(){

  // formulário

  function repeatDates(){
    const mode=$("fRep").value, start=$("fData").value; if(mode==="nao"||!start)return {dates:[],skipped:[]};
    const ate=$("fRepAte").value||endOfMonth(start);
    const dias=new Set(checked("rdow").map(Number)); const dates=[], skipped=[];
    for(let diff=1; diff<=400&&dates.length<120; diff++){const s=addDays(start,diff); if(s>ate)break; const di=dowIdx(s); let ok=false;
      if(mode==="semana")ok=diff%7===0; else if(mode==="quinzena")ok=diff%14===0; else if(mode==="uteis")ok=di<5; else if(mode==="dias")ok=dias.has(di);
      if(!ok)continue; if(HOLIDAYS[s]){skipped.push(s);continue;} dates.push(s);}
    return {dates,skipped};
  }
  function syncRepeat(){

    if(mode!=="nao"&&!$("fRepAte").value&&$("fData").value)$("fRepAte").value=endOfMonth($("fData").value);
    const {dates,skipped}=repeatDates(); const p=$("repPreview"); p.className="hint";

  }
  $("fData").addEventListener("input",dayHint);

  function dayHint(){const v=$("fData").value; const h=$("dayHint"); h.className="hint"; h.textContent="";

  $("form").addEventListener("submit",async ev=>{

    col.onSnapshot(snap=>{emails=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));render(); if(!$("overlay").hidden)dayHint();},
      ()=>notice("Não foi possível carregar os e-mails. Recarregue a página."));
  });
})();
</script>
